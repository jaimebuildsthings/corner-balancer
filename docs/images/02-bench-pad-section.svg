<circle cx="335" cy="190" r="9" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/><text x="335" y="194" font-size="11.5" font-weight="600" fill="#1f1f1c" text-anchor="middle">6</text>
<text x="24" y="268" font-size="13" font-weight="600" fill="#1f1f1c">1  Top plate</text>
<text x="24" y="284" font-size="11.5" fill="#5f5e57">12 mm ply or 6 mm aluminum; must not flex</text>
<text x="24" y="318" font-size="13" font-weight="600" fill="#1f1f1c">2  Load cell, 50 kg</text>
<text x="24" y="334" font-size="11.5" fill="#5f5e57">only the center button touches the top plate</text>
<text x="24" y="368" font-size="13" font-weight="600" fill="#1f1f1c">3  Mount cup</text>
<text x="24" y="384" font-size="11.5" fill="#5f5e57">recess under the beam so it flexes freely</text>
<text x="392" y="268" font-size="13" font-weight="600" fill="#1f1f1c">4  Base plate</text>
<text x="392" y="284" font-size="11.5" fill="#5f5e57">rigid, same size; rubber feet underneath</text>
<text x="392" y="318" font-size="13" font-weight="600" fill="#1f1f1c">5  Overload stop</text>
<text x="392" y="334" font-size="11.5" fill="#5f5e57">bolt set ~1 mm below the plate; catches a drop</text>
<text x="392" y="368" font-size="13" font-weight="600" fill="#1f1f1c">6  Locating pin</text>
<text x="392" y="384" font-size="11.5" fill="#5f5e57">oversize hole: stops sliding, carries no load</text>
