<circle cx="455" cy="277" r="9" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/><text x="455" y="281" font-size="11.5" font-weight="600" fill="#1f1f1c" text-anchor="middle">4</text>
<circle cx="624" cy="302" r="9" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/><text x="624" y="306" font-size="11.5" font-weight="600" fill="#1f1f1c" text-anchor="middle">5</text>
<circle cx="300" cy="352" r="9" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/><text x="300" y="356" font-size="11.5" font-weight="600" fill="#1f1f1c" text-anchor="middle">6</text>
<circle cx="120" cy="250" r="9" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/><text x="120" y="254" font-size="11.5" font-weight="600" fill="#1f1f1c" text-anchor="middle">7</text>
<circle cx="242" cy="200" r="9" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/><text x="242" y="204" font-size="11.5" font-weight="600" fill="#1f1f1c" text-anchor="middle">8</text>
<text x="24" y="392" font-size="13" font-weight="600" fill="#1f1f1c">1  Slip plate</text>
<text x="24" y="408" font-size="11.5" fill="#5f5e57">two greased sheets; tire can shift as it settles</text>
<text x="24" y="436" font-size="13" font-weight="600" fill="#1f1f1c">2  Top plate</text>
<text x="24" y="452" font-size="11.5" fill="#5f5e57">10 mm aluminum or ribbed steel; must not flex</text>
<text x="24" y="480" font-size="13" font-weight="600" fill="#1f1f1c">3  Load cell, ~500 kg</text>
<text x="24" y="496" font-size="11.5" fill="#5f5e57">shear beam bolted at one end, ball at the free end</text>
<text x="24" y="524" font-size="13" font-weight="600" fill="#1f1f1c">4  Overload stop</text>
<text x="24" y="540" font-size="11.5" fill="#5f5e57">a few mm below the plate; catches a hard drop</text>
<text x="392" y="392" font-size="13" font-weight="600" fill="#1f1f1c">5  Base frame</text>
<text x="392" y="408" font-size="11.5" fill="#5f5e57">steel; carries the cells and electronics box</text>
<text x="392" y="436" font-size="13" font-weight="600" fill="#1f1f1c">6  Leveling foot</text>
<text x="392" y="452" font-size="11.5" fill="#5f5e57">threaded with lock nut; level all four pads</text>
<text x="392" y="480" font-size="13" font-weight="600" fill="#1f1f1c">7  Ramp</text>
<text x="392" y="496" font-size="11.5" fill="#5f5e57">same height as the slip plate, separate part</text>
<text x="392" y="524" font-size="13" font-weight="600" fill="#1f1f1c">8  Gap</text>
<text x="392" y="540" font-size="11.5" fill="#5f5e57">a few mm, so roll-on impact never loads the cells</text>
</svg>
