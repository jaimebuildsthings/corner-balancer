<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" width="760" height="438" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Bench pad wiring">
<rect width="760" height="438" fill="#ffffff"/>
<defs><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b998f"/></marker></defs>
<text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1c">Four half-bridge cells form one full bridge for one HX711</text>
<text x="24" y="48" font-size="11.5" fill="#5f5e57">Bench pad wiring; red center wires in blue</text>
<path d="M140 102H190" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<path d="M245 124V200" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<path d="M190 222H140" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<path d="M85 200V124" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<text x="165" y="160" font-size="11.5" fill="#5f5e57" text-anchor="middle">outer</text>
<text x="165" y="176" font-size="11.5" fill="#5f5e57" text-anchor="middle">wires</text>
<path d="M85 80V64H360V104H400" fill="none" stroke="#2f6fd6" stroke-width="1.5"/>
<path d="M300 102H330V140H400" fill="none" stroke="#2f6fd6" stroke-width="1.5"/>
<path d="M300 206H400" fill="none" stroke="#2f6fd6" stroke-width="1.5"/>
<path d="M85 244V262H370V236H400" fill="none" stroke="#2f6fd6" stroke-width="1.5"/>
<rect x="30" y="80" width="110" height="44" rx="8" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<text x="85" y="98" font-size="13" font-weight="600" fill="#1f1f1c" text-anchor="middle">Cell A</text>
<text x="85" y="114" font-size="11.5" fill="#5f5e57" text-anchor="middle">red to E+</text>
<rect x="190" y="80" width="110" height="44" rx="8" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<text x="245" y="98" font-size="13" font-weight="600" fill="#1f1f1c" text-anchor="middle">Cell B</text>
<text x="245" y="114" font-size="11.5" fill="#5f5e57" text-anchor="middle">red to A+</text>
<rect x="190" y="200" width="110" height="44" rx="8" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<text x="245" y="218" font-size="13" font-weight="600" fill="#1f1f1c" text-anchor="middle">Cell C</text>
<text x="245" y="234" font-size="11.5" fill="#5f5e57" text-anchor="middle">red to E−</text>
<rect x="30" y="200" width="110" height="44" rx="8" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<text x="85" y="218" font-size="13" font-weight="600" fill="#1f1f1c" text-anchor="middle">Cell D</text>
<text x="85" y="234" font-size="11.5" fill="#5f5e57" text-anchor="middle">red to A−</text>
<rect x="400" y="80" width="140" height="180" rx="8" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<text x="470" y="72" font-size="13" font-weight="600" fill="#1f1f1c" text-anchor="middle">HX711</text>
<text x="412" y="108" font-size="11.5" fill="#1f1f1c">E+</text>
<text x="412" y="144" font-size="11.5" fill="#1f1f1c">A+</text>
<text x="412" y="210" font-size="11.5" fill="#1f1f1c">E−</text>
<text x="412" y="240" font-size="11.5" fill="#1f1f1c">A−</text>
<text x="528" y="114" font-size="11.5" fill="#1f1f1c" text-anchor="end">VCC</text>
<text x="528" y="154" font-size="11.5" fill="#1f1f1c" text-anchor="end">GND</text>
<text x="528" y="194" font-size="11.5" fill="#1f1f1c" text-anchor="end">DOUT</text>
<text x="528" y="234" font-size="11.5" fill="#1f1f1c" text-anchor="end">SCK</text>
<path d="M620 110H540" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<path d="M620 150H540" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<path d="M540 190H620" fill="none" stroke="#9b998f" stroke-width="1.25" marker-end="url(#w)"/>
<path d="M620 230H540" fill="none" stroke="#9b998f" stroke-width="1.25" marker-end="url(#w)"/>
<rect x="620" y="80" width="116" height="180" rx="8" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<text x="678" y="72" font-size="13" font-weight="600" fill="#1f1f1c" text-anchor="middle">ESP32</text>
<text x="632" y="114" font-size="11.5" fill="#1f1f1c">3.3 V</text>
<text x="632" y="154" font-size="11.5" fill="#1f1f1c">GND</text>
<text x="632" y="194" font-size="11.5" fill="#1f1f1c">GPIO (in)</text>
<text x="632" y="234" font-size="11.5" fill="#1f1f1c">GPIO (out)</text>
<text x="24" y="294" font-size="11.5" fill="#5f5e57">Adjacent cells join outer wire to outer wire; each cell's red center wire goes to one terminal.</text>
<text x="24" y="312" font-size="11.5" fill="#5f5e57">Wire colors vary by vendor: confirm with the seller's diagram or a multimeter before soldering.</text>
<text x="24" y="342" font-size="13" font-weight="600" fill="#1f1f1c">For robustness</text>
<text x="24" y="362" font-size="11.5" fill="#1f1f1c">Shielded 4-core cable from pad to HX711; ground the shield at the HX711 end only.</text>
<text x="24" y="380" font-size="11.5" fill="#1f1f1c">Cable glands or clamps at every exit, so a tug never reaches a solder joint.</text>
<text x="24" y="398" font-size="11.5" fill="#1f1f1c">Solder or crimp with heat-shrink in a small junction box; no breadboard jumpers in the final build.</text>
<text x="24" y="416" font-size="11.5" fill="#1f1f1c">HX711 in its own enclosure, close to the cells and away from the ESP32's antenna.</text>
</svg>
