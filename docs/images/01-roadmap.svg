<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" width="760" height="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Build roadmap">
<rect width="760" height="248" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b998f"/></marker></defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1c">Each phase must pass its gate before the next starts</text>
<path d="M220 120H235" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<path d="M474 120H489" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<path d="M263 120H278" fill="none" stroke="#9b998f" stroke-width="1.25" marker-end="url(#a)"/>
<path d="M517 120H532" fill="none" stroke="#9b998f" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="24" y="64" width="196" height="112" rx="8" fill="#2f6fd6" stroke="#2f6fd6" stroke-width="2" fill-opacity="0.12"/>
<rect x="278" y="64" width="196" height="112" rx="8" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<rect x="532" y="64" width="196" height="112" rx="8" fill="none" stroke="#9b998f" stroke-width="1.25"/>
<text x="36" y="88" font-size="13" font-weight="600" fill="#1f1f1c">Phase 1: bench pad</text>
<text x="36" y="112" font-size="11.5" fill="#1f1f1c">1a: one 200 kg pad</text>
<text x="36" y="128" font-size="11.5" fill="#1f1f1c">1b: two pads, ESP-NOW,</text>
<text x="36" y="144" font-size="11.5" fill="#1f1f1c">phone UI</text>
<text x="36" y="164" font-size="11.5" fill="#5f5e57">approx. $115–200</text>
<text x="290" y="88" font-size="13" font-weight="600" fill="#1f1f1c">Phase 2: full-size pad</text>
<text x="290" y="112" font-size="11.5" fill="#1f1f1c">2,000 kg, one pad</text>
<text x="290" y="128" font-size="11.5" fill="#1f1f1c">Car-grade cells, ramps,</text>
<text x="290" y="144" font-size="11.5" fill="#1f1f1c">slip plate</text>
<text x="544" y="88" font-size="13" font-weight="600" fill="#1f1f1c">Phase 3: four pads</text>
<text x="544" y="112" font-size="11.5" fill="#1f1f1c">Leveling and the</text>
<text x="544" y="128" font-size="11.5" fill="#1f1f1c">corner-weight app</text>
<text x="544" y="144" font-size="11.5" fill="#1f1f1c">(cross weight, %)</text>
<polygon points="235,120 249,106 263,120 249,134" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/>
<text x="249" y="204" font-size="11.5" font-weight="600" fill="#1f1f1c" text-anchor="middle">Gate 1</text>
<text x="249" y="220" font-size="11.5" fill="#5f5e57" text-anchor="middle">0.1% repeat, off-center,</text>
<text x="249" y="236" font-size="11.5" fill="#5f5e57" text-anchor="middle">two-pad split passes</text>
<polygon points="489,120 503,106 517,120 503,134" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/>
<text x="503" y="204" font-size="11.5" font-weight="600" fill="#1f1f1c" text-anchor="middle">Gate 2</text>
<text x="503" y="220" font-size="11.5" fill="#5f5e57" text-anchor="middle">one corner repeats</text>
<text x="503" y="236" font-size="11.5" fill="#5f5e57" text-anchor="middle">within 2–3 kg</text>
</svg>
