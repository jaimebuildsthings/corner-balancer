[package]
name = "pad"
description = "Firmware for one corner-scale pad (ESP32-S3 or ESP32)"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/jaimebuildsthings/corner-balancer"
publish = false

[[bin]]
name = "pad"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["esp32s3"]
# Exactly one chip feature. The original ESP32 build is for bench work on spare boards.
esp32s3 = [
  "esp-hal/esp32s3",
  "esp-rtos/esp32s3",
  "esp-bootloader-esp-idf/esp32s3",
  "esp-println/esp32s3",
  "esp-storage/esp32s3",
  "esp-radio/esp32s3",
  "esp-alloc/esp32s3",
]
esp32 = [
  "esp-hal/esp32",
  "esp-rtos/esp32",
  "esp-bootloader-esp-idf/esp32",
  "esp-println/esp32",
  "esp-storage/esp32",
  "esp-radio/esp32",
  "esp-alloc/esp32",
]
# Replace the HX711 with simulated readings, for boards without load cells.
sim = []

[dependencies]
esp-hal = { version = "~1.2.2", features = ["unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-radio", "esp-alloc"] }
esp-bootloader-esp-idf = "0.6.0"
esp-println = "0.18.0"
esp-storage = "0.10.0"
# Beta: pinned exactly so a new pre-release can't change the API under us.
esp-radio = { version = "=1.0.0-beta.1", features = ["esp-now", "wifi", "unstable"] }
esp-alloc = "0.11.0"
# Web UI on the host pad: Wi-Fi access point, DHCP, captive DNS, HTTP + WebSocket.
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "medium-ethernet", "proto-ipv4"] }
embassy-futures = "0.1"
picoserve = { version = "0.20.1", features = ["embassy", "ws"] }
edge-dhcp = "0.8.0"
edge-captive = "0.8.0"
edge-nal = "0.7.0"
edge-nal-embassy = "0.9.0"
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-sync = "0.8.0"
critical-section = "1.2.0"
static_cell = "2.1.1"

ds18b20 = { path = "../crates/ds18b20" }
hx711 = { path = "../crates/hx711" }
protocol = { path = "../crates/protocol" }
scale = { path = "../crates/scale" }

[profile.dev]
# Unoptimized builds are too slow and too big for the chip.
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
