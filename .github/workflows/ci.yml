name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep these in step with the versions you develop with (`espup --version`, `rustc +esp --version`).
  ESPUP_VERSION: v0.17.1
  ESP_TOOLCHAIN_VERSION: 1.97.0.0
  ESPFLASH_VERSION: v4.6.0

jobs:
  host:
    name: Host crates (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            firmware/target
          key: host-${{ hashFiles('firmware/Cargo.lock') }}
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  firmware:
    name: Firmware (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: esp32s3, chip: esp32s3, target: xtensa-esp32s3-none-elf, features: esp32s3, release: true }
          - { name: esp32s3-sim, chip: esp32s3, target: xtensa-esp32s3-none-elf, features: "esp32s3,sim", release: false }
          - { name: esp32, chip: esp32, target: xtensa-esp32-none-elf, features: esp32, release: true }
          - { name: esp32-sim, chip: esp32, target: xtensa-esp32-none-elf, features: "esp32,sim", release: false }
    defaults:
      run:
        working-directory: firmware/pad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/.cargo/registry
            firmware/pad/target
          key: fw-${{ matrix.name }}-${{ env.ESP_TOOLCHAIN_VERSION }}-${{ hashFiles('firmware/pad/Cargo.lock') }}

      - name: Install the ESP Rust toolchain and espflash
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL "https://github.com/esp-rs/espup/releases/download/${ESPUP_VERSION}/espup-x86_64-unknown-linux-gnu" -o ~/.local/bin/espup
          curl -fsSL "https://github.com/esp-rs/espflash/releases/download/${ESPFLASH_VERSION}/espflash-x86_64-unknown-linux-gnu.zip" -o /tmp/espflash.zip
          unzip -o /tmp/espflash.zip -d ~/.local/bin
          chmod +x ~/.local/bin/espup ~/.local/bin/espflash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/espup install --targets esp32,esp32s3 --toolchain-version "$ESP_TOOLCHAIN_VERSION" --export-file ~/export-esp.sh

      - name: Clippy
        run: |
          source ~/export-esp.sh
          cargo clippy --release --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }} -- -D warnings

      - name: Build
        run: |
          source ~/export-esp.sh
          cargo build --release --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }}

      - name: Make flashable images
        if: matrix.release && startsWith(github.ref, 'refs/tags/v')
        run: |
          elf=target/${{ matrix.target }}/release/pad
          mkdir -p dist
          # App only, for OTA updates.
          espflash save-image --chip ${{ matrix.chip }} "$elf" dist/pad-${{ matrix.chip }}-app.bin
          # Bootloader + partition table + app, flashed at 0x0.
          espflash save-image --chip ${{ matrix.chip }} --merge --partition-table partitions.csv "$elf" dist/pad-${{ matrix.chip }}-full.bin
          # TODO: publish these with an ESP Web Tools page so builders can flash from the browser.

      - if: matrix.release && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pad-${{ matrix.chip }}-${{ github.ref_name }}
          path: firmware/pad/dist/*.bin
