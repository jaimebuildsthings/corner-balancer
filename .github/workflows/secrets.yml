name: Secrets

# Scans only the new commits for leaked credentials: on a pull request, base..head
# of the PR; on a push to main, before..after of the push. GitHub's own secret
# scanning and push protection are on for the repo too; this adds TruffleHog's
# detectors and checks whether a found credential actually works.
#
# TruffleHog is AGPL-3.0. It runs here as a CI tool and isn't part of what this
# project ships, so it doesn't affect the project's license.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (new commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the base commit is there to diff against.
          fetch-depth: 0
          persist-credentials: false
      # With no base/head inputs, the action picks the range from the event:
      # pull_request.base.sha..head.sha, or the push's before..after.
      - uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          # Docker image tag; keep in step with the action's version above.
          version: 3.99.2
          # Report only credentials TruffleHog confirmed are live (the current
          # spelling of --only-verified). The action already passes --fail.
          extra_args: --results=verified
